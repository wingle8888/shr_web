<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="商品详情 - 开发板商城">
  <title>商品详情 - 开发板商城</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="detail-page" data-i18n-title="detailTitle">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="top-bar">
    <div class="container top-bar-inner">
      <span data-i18n="topBar">可注册也可游客购买 · 支持国际支付 · 现货 24h 发货</span>
      <div class="top-bar-actions">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="zh">中文</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <div class="auth-area" id="authArea">
          <a class="link-btn" href="/?auth=login" id="loginBtn" data-i18n="login">登录</a>
          <a class="link-btn" href="/?auth=register" id="registerBtn" data-i18n="register">注册</a>
          <span class="auth-user" id="authUser" hidden></span>
          <button type="button" class="link-btn" id="logoutBtn" data-i18n="logout" hidden>退出</button>
        </div>
        <a href="/#orders-help" class="link-btn" data-i18n="buyGuide">购买说明</a>
      </div>
    </div>
  </div>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">SHR</div>
        <span class="logo-text" data-i18n="brand">开发板商城</span>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <a href="/#products" class="header-cart" data-i18n="backMall">返回商城</a>
        <button class="header-cart" id="cartBtn" type="button">
          <span data-i18n="cart">购物车</span>
          <span class="cart-badge" id="cartBadge" style="display:none">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container detail-main" id="detailMain">
    <p class="detail-loading" data-i18n="loading">正在加载商品详情…</p>
  </main>

  <div class="modal-overlay" id="cartModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3 data-i18n="cartTitle">购物车</h3>
        <button class="modal-close" id="modalClose" type="button">&times;</button>
      </div>
      <div class="modal-body" id="cartBody"></div>
      <div class="modal-footer">
        <div class="cart-total"><span data-i18n="total">合计：¥</span><span id="cartTotal">0.00</span></div>
        <a class="btn checkout-btn" href="/#products" id="goMallBtn" data-i18n="goCheckoutMall">去商城结算</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products-data.js"></script>
  <script src="/js/products-en.js"></script>
  <script src="/js/products-loader.js"></script>
  <script src="/js/product-detail.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
