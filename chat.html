<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客服 - 开发板商城</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=20260920d">
</head>
<body class="chat-page" data-i18n-title="chatName">
  <div class="chat-panel chat-panel-page" id="chatPanel">
    <div class="chat-header" id="chatHeader">
      <div class="chat-agent">
        <div class="chat-avatar-wrap">
          <div class="chat-avatar">客</div>
          <span class="presence-dot" id="chatSellerDot" aria-hidden="true"></span>
        </div>
        <div>
          <div class="chat-agent-name" data-i18n="chatName">开发板商城客服</div>
          <div class="chat-agent-status" id="chatAgentStatus">离线</div>
        </div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-quick" id="chatQuick">
      <button type="button" data-q="price" data-i18n="qPrice">产品价格</button>
      <button type="button" data-q="ship" data-i18n="qShip">发货物流</button>
      <button type="button" data-q="order" data-i18n="qOrder">订单查询</button>
      <button type="button" data-q="human" data-i18n="qHuman">人工客服</button>
    </div>
    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" data-i18n-placeholder="chatPlaceholder" placeholder="输入消息..." autocomplete="off" maxlength="500" required>
      <button type="submit" class="chat-send" data-i18n="send" data-i18n-aria="send">发送</button>
    </form>
  </div>
  <script src="/js/i18n.js?v=20260919n"></script>
  <script src="/js/auth.js?v=20260919n"></script>
  <script src="/js/chat.js?v=20260919b"></script>
</body>
</html>
